[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pact-contract-agent"
version = "0.1.0"
description = "Version-aware contract review, approval and renewal execution with LangGraph"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.135,<1", "uvicorn>=0.41,<1", "langgraph>=1.1,<2",
 "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-postgres>=3,<4",
 "sqlalchemy>=2.0.48,<3", "psycopg[binary,pool]>=3.3,<4", "httpx>=0.28,<1",
 "pydantic-settings>=2.13,<3", "python-multipart>=0.0.22,<1",
 "pypdf>=6.9,<7", "python-docx>=1.2,<2", "certifi>=2026.2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<1", "pip-audit>=2.10,<3"]
ml = ["sentence-transformers>=5,<6", "torch>=2.10,<3", "transformers>=5.3,<6"]
ocr = ["docling>=2,<3"]

[tool.setuptools.packages.find]
include = ["pact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
